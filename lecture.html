<style>
:root{--bg:#f6f1e7;--ink:#1a140e;--peach:#ffcc99;--gold:#ff9900;--ice:#99ccff;--ok:#99cc99;--lilac:#cc99cc;--rose:#cc6666;--font:Antonio,"Arial Narrow",sans-serif}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:var(--font);overflow:hidden}
body{display:grid;grid-template-rows:auto minmax(0,1fr) auto;height:100dvh}

main.one{grid-template-columns:1fr}
.stage-copy{min-width:0;min-height:0;overflow:hidden;display:flex;flex-direction:column;gap:6px}
.stage-art{min-width:0;min-height:0;overflow:hidden;display:flex;flex-direction:column;gap:8px}
.chrome{background:var(--bg);flex-shrink:0}
iframe.game,video.game{grid-column:1/-1;width:100%;height:100%;border:0;min-height:0;background:#fff}
audio.game{width:100%;min-height:48px}
.vtape{display:block;width:100%;text-align:left;margin:4px 0;min-height:56px}
.vtape small{display:block;opacity:.75;font-weight:500;letter-spacing:.06em}
header{display:grid;grid-template-columns:72px 1fr auto auto auto;gap:6px;padding:6px 12px 0}
#watchhead,#callhead{min-width:100px;min-height:48px;font-size:18px}
#watchhead{background:#99cc99}
#callhead{background:#cc6666;color:#fff}
.cap{background:var(--gold);color:#000;border-radius:0 0 0 36px;display:flex;align-items:flex-end;justify-content:flex-end;padding:0 12px 6px;font-weight:700}
.title{background:var(--lilac);color:#000;border-radius:0 0 28px 0;padding:0 14px 6px;display:flex;align-items:flex-end;justify-content:space-between;min-width:0}
.title b{font-size:clamp(16px,2.2vw,28px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.clock{background:#f7ae45;color:#000;border-radius:0 0 24px 24px;padding:6px 12px;text-align:right}
h1{color:#9a3412;margin:0;letter-spacing:.06em;font-size:clamp(26px,3.6vw,52px);line-height:1.08;flex:0 0 auto}
main .body{background:transparent;color:var(--ink);padding:0;border-radius:0;font-size:clamp(18px,2.1vw,28px);line-height:1.28;font-weight:500;overflow:auto;min-height:0;flex:1 1 auto}
main .body p{color:var(--ink);margin:0 0 8px;font-size:inherit;line-height:inherit;font-weight:500}
.ask{color:#1e3a5f;font-size:clamp(16px,1.9vw,24px);margin:4px 0 0;flex:0 0 auto}
.row{display:flex;flex-wrap:nowrap;gap:6px;overflow:hidden}
button{min-height:44px;border:0;border-radius:0 16px;padding:8px 12px;font:700 14px var(--font);background:var(--gold);color:#000;cursor:pointer;white-space:nowrap}
.ok{background:var(--ok)}
.open-art,.howto-shot{width:100%;max-height:62vh;object-fit:contain;object-position:center;border-radius:0 18px;background:#fff;flex:1 1 auto}
figure.frame{margin:0;display:flex;flex-direction:column;gap:4px;min-height:0}
figure.frame figcaption{color:#1e3a5f;font-size:clamp(13px,1.4vw,18px);letter-spacing:.03em;line-height:1.25}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:10px;min-height:0;flex:1}
.pair figure.frame img{max-height:54vh}
.cite{color:#1e3a5f;letter-spacing:.05em;font-size:clamp(13px,1.4vw,18px);flex:0 0 auto}
nav.lab-dock{position:relative;z-index:10000;background:var(--bg)}
.callbar{display:flex;gap:8px;align-items:center;padding:4px 12px;background:#efe6d6;overflow:hidden;min-height:0}
.callbar:empty{display:none}
.callbar button{min-height:40px;flex:0 0 auto}
.callbar b{flex:1;min-width:0;font-size:clamp(16px,2.4vw,26px);color:#9a3412;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#callflash{display:none !important}
.pocketqr{float:none;width:100%;margin:0;background:#ffcc99;color:#000;border-radius:0 18px;padding:8px;text-align:center}
.pocketqr img{width:100%;max-height:46vh;height:auto;display:block;background:#fff;object-fit:contain}
.pocketqr b{display:block;letter-spacing:.12em;font-size:13px;margin-top:4px}
.pocketqr small{display:block;font-size:10px;word-break:break-all}
.stage-copy .row{flex-wrap:wrap}
.docket{display:flex;flex-direction:column;gap:8px;min-height:0;flex:1}

.docket .score{font-size:clamp(16px,2vw,26px);color:#9a3412;letter-spacing:.08em;margin:0}
.call .bars{display:flex;flex-direction:column;gap:8px;min-height:0}
.call .opt{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:58px;padding:8px 14px;border-radius:0 16px;color:#000;font-weight:700;font-size:clamp(15px,1.7vw,22px);line-height:1.2}
.call .opt b{font-weight:700}
.call .opt em{font-style:normal;font-size:clamp(18px,2vw,28px);flex:0 0 auto}
.call .opt.ice{background:#99ccff}
.call .opt.gold{background:#ff9900}
.call .opt.peach{background:#ffcc99}
.call .opt.rose{background:#cc6666;color:#fff}
.call .opt.key{outline:4px solid #1a140e}
.vote{display:flex;gap:10px;margin-top:4px}
.vote button{flex:1;min-height:64px;font-size:clamp(18px,2.4vw,32px);letter-spacing:.08em;white-space:normal}
.stage-copy iframe.game,.stage-copy video.game{flex:1;height:100%;min-height:42vh}
body.conf h1{font-size:clamp(40px,6vw,84px)}
body.conf main .body{font-size:clamp(22px,2.6vw,36px);line-height:1.35}
body.conf .ask{font-size:clamp(28px,3.4vw,48px);color:var(--gold)}
</style>

<script>
(function(){
  var LS_VIDS=[
    {title:"Due Process · Crash Course 28", mins:"board brief",
     file:"/videos/due-process.mp4",
     say:[
       "Due process means the government has to play fair before it takes life, liberty, or property from you.",
       "The Fifth Amendment binds the federal government. The Fourteenth binds the states. A public school is the state.",
       "Procedure is the how: notice of the charge, a chance to tell your side, someone who decides.",
       "Goss v. Lopez: a ten-day suspension is not small. Ohio already promised public school. They cannot take those days without notice and a chance to speak.",
       "It is not a full trial. No lawyer is required for a short suspension. It is also not a silent walk to the office."
     ],
     ask:"Name the two things Goss requires before a short suspension."},
    {title:"Equal Protection · Crash Course 29", mins:"board brief",
     file:"/videos/equal-protection.mp4",
     say:[
       "Equal protection is the Fourteenth Amendment's other half: the state may not treat people worse without a real reason.",
       "A principal is the state. A handbook rule is the state. A suspension is the state acting.",
       "Today we are not litigating race or classification. We are noticing who the state is in this building.",
       "If the school can skip notice for one student and not another, that is both due process and equal protection in the same hallway."
     ],
     ask:"Why does the 14th reach a public-school principal?"},
    {title:"Goss v. Lopez · Oral Argument", mins:"audio + brief",
     mp3:"/api/media/goss",
     say:[
       "October 16, 1974. Nine Ohio students, including Dwight Lopez, got up to ten days out. No hearing.",
       "The school said: we need to keep order. The students said: you took our education without asking.",
       "Listen for three words: notice. opportunity. heard.",
       "When a justice or a lawyer talks past those words, pause. Ask: was that a hearing, or a meeting?"
     ],
     ask:"Pause. Was that notice? A chance to be heard? Who decided?"}
  ];
  var ILS_VIDS=[
    {title:"Taking Notes · naming log", mins:"board brief",
     file:"/videos/taking-notes.mp4",
     say:[
       "Cornell notes: cue on the left, facts on the right, summary at the bottom. That is a naming log for your own brain.",
       "Today's clinic rule is the same shape: one pattern, every paper, so a stranger can open the Brooks file.",
       "Last name first. Date. What the sheet is. That is the cue column of a file."
     ],
     ask:"Write the clinic name for the Brooks intake sheet."},
    {title:"One system · every paper", mins:"board brief",
     file:"/videos/planning.mp4",
     say:[
       "One system. Same pattern every time. That is how a file survives you.",
       "If you invent a new name for every sheet, the next person cannot search. That is a pile, not a file.",
       "285-ILS-2026-014 is the matter. BROOKS is the tab. Exhibits stay exhibits."
     ],
     ask:"Say the naming pattern out loud once."},
    {title:"A memo is a short paper", mins:"board brief",
     file:"/videos/papers.mp4",
     say:[
       "A memo is a short paper with numbered steps. Subject line first. ",
       "You dump the facts. You label the papers.",
       "If it would not survive a stranger, it is not done."
     ],
     ask:"What is the last line of today's memo not allowed to be?"},
    {title:"Docket · how a court finds a matter", mins:"board brief",
     file:"/videos/scotus-proc.mp4",
     say:[
       "A docket is a list of matters. A file number is how the office finds the jacket later.",
       "The Supreme Court puts every case on a docket. We put Brooks on 285-ILS-2026-014.",
       "If the number is wrong, the exhibit is lost. That is today's whole job."
     ],
     ask:"What is today's file number?"}
  ];
  function vidList(){
    var fallback = (course==="LS"?LS_VIDS:ILS_VIDS);
    var k = (kit && kit.videos) || [];
    if (k.length && k[0] && (k[0].say || []).length) return k;
    return fallback;
  }
  var kit=null, slide=0, spoken=false, mailShown=false, mailPrinted=false, viewKey="", course=LawKit.courseNow(), iso=LawKit.iso(), lastPeriod="", overlay=null, manual=false, manualPhase="", letterHold=false, letterPhase="", rangKey="", ringTries=0, watchOn=false, watchI=-1, readerSpoken="", leaderSpoken="";
  var SAY = (window.speechSynthesis && speechSynthesis.speak) ? speechSynthesis.speak.bind(speechSynthesis) : null;
  function openWatch(idx){
    watchOn=true;
    watchI = (idx==null || idx==="") ? -1 : Number(idx);
    viewKey="";
    paint();
  }
  function closeWatch(){
    watchOn=false; watchI=-1; viewKey=""; paint();
  }
  function pocketUrl(){
    return "http://ituxpro.local:8080/pocket.html?tab=quiz";
  }
  function pocketQrSrc(){
    return "pocket-qr.svg";
  }
  function pocketBox(){
    return "<aside class='pocketqr'><img src='"+pocketQrSrc()+"' alt='Pocket QR'><b>PHONE</b><small>"+pocketUrl()+"</small></aside>";
  }
  function setStage(copy, art, wide){
    var main=document.getElementById("main");
    if(art){
      main.className=wide?"deck":"";
      main.innerHTML="<div class='stage-copy'>"+copy+"</div><aside class='stage-art'>"+art+"</aside>";
    } else {
      main.className="one";
      main.innerHTML="<div class='stage-copy'>"+copy+"</div>";
    }
    if(document.getElementById("booktext")) fillBook();
  }
  function esc(s){
    return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
  }
  function frameHtml(frames){
    var figs=(frames||[]).map(function(f){
      var src=typeof f==="string"?f:(f.src||"");
      var cap=typeof f==="string"?"":(f.cap||"");
      if(!src) return "";
      return "<figure class='frame'><img class='open-art' alt='"+esc(cap)+"' src='"+esc(src)+"' onerror=\"this.parentNode.style.display='none'\"><figcaption>"+esc(cap)+"</figcaption></figure>";
    }).join("");
    if((frames||[]).length>=2) return "<div class='pair'>"+figs+"</div>";
    return figs;
  }
  function titleCardHtml(){
    var plan=(kit&&kit.plan)||{};
    var title=plan.title||((course==="LS"?"LS":"ILS")+" · Room 285");
    var obj=plan.objective||"";
    var purp=(window.LawKit&&LawKit.purpose)?LawKit.purpose(plan):"";
    return {
      copy: "<h1>"+title+"</h1>"+
        "<p class='cite'>"+(course||"")+" · "+(iso||"")+" · first 15 · scan the code</p>"+
        (obj?("<p class='body'>"+obj+"</p>"):"<p class='body'>Scan the code. Sit. The quiz is work you already learned.</p>")+
        (purp?("<p class='cite'><b>Purpose.</b> "+purp+"</p>"):""),
      art: pocketBox()
    };
  }
  function inOnboard(){
    if(!iso) return false;
    if(iso>="2026-08-24" && iso<="2026-09-18") return true;
    if(iso>="2027-01-19" && iso<="2027-02-06") return true;
    return false;
  }
  function deckSlides(){
    var slides=((kit&&kit.deck&&kit.deck.slides)||[]).slice();
    if(!inOnboard() || !slides.length) return slides;
    if(slides.some(function(s){ return s && s.id==="how-click"; })) return slides;
    var how=[
      {id:"how-click", title:"OFFICE · where you tap", shots:["howto/office-mail.svg"],
        body:["1  LAST, FIRST — no PIN on Office.","2  Ice-blue OPEN FILE on the left.","3  SUBJECT LINE on the right. Copy it. Do not invent a jacket tab.","4  MEMO. Numbered steps. ","5  SEND FIRST DRAFT. Answer the partner’s questions. Then FILE FINAL."],
        ask:"Point at OPEN FILE on this picture."},
      {id:"how-file", title:"OPEN FILE · the packet", shots:["howto/office-file.svg"],
        body:["This is the file. Facts and papers live here.","Copy the subject line. Write the memo from what you see, not from a folder cover."],
        ask:"What do you copy into SUBJECT LINE?"},
      {id:"how-clerk", title:"PARTNER · questions then model", shots:["howto/office-clerk.svg"],
        body:["First send = partner asks clarifying questions. Rewrite.","Second send = FILE FINAL. You see the model, not a grade.","Mongan still sets the Campus letter later."],
        ask:"When do you tap FILE FINAL?"}
    ];
    return [slides[0]].concat(how).concat(slides.slice(1));
  }
  function gpu(){
    var pack=overlay||{};
    if(pack.iso && pack.iso!==iso) return {};
    var c=pack.courses||{};
    return c[course] || ((course==="LS") ? (c.LS||{}) : (c.ILS||{})) || {};
  }
  function loadOverlay(){
    var urls=["/night-clerk/overlay-"+iso+".json","/night-clerk/overlay.json","night-clerk/overlay.json"];
    function next(i){
      if(i>=urls.length) return;
      fetch(urls[i], {cache:"no-store"}).then(function(r){ return r.ok?r.json():null; }).then(function(j){
        if(j && j.courses){ overlay=j; viewKey=""; paint(); }
        else next(i+1);
      }).catch(function(){ next(i+1); });
    }
    next(0);
  }
  function memoHtml(){
    var m=(kit&&kit.memo)||{};
    var from=m.fromName||m.from||"Partner";
    var sub=m.subject||m.subjectLine||"";
    var body=String(m.body||"").trim();
    var steps=(m.steps||[]).map(function(s){ return "<p>"+esc(s)+"</p>"; }).join("");
    var tape=window.__tapeNote||"";
    return "<h1>MEMO</h1>"+
      "<p class='cite'>From "+esc(from)+" · Lead 1 reads once. Do not type yet.</p>"+
      (sub?("<p class='ask'>"+esc(sub)+"</p>"):"")+
      "<div class='body'><p>"+(body?esc(body):"Open OFFICE. The letter is on the file.")+"</p>"+steps+"</div>"+
      "<p class='cite'>"+(tape?esc(tape):"Class is in OFFICE. This board does not speak the letter.")+"</p>";
  }
  function classBeat(ph){
    return ph && ["entry","quiz","mail","huddle","brief","lead","model","guide","handoff","socratic","do","play","game","lib","read","exit","bridge","wrap"].indexOf(ph.id)>=0;
  }
  function ringOnce(force){
    if(force || course==="PLAN") return;
    var ph=LawKit.phase();
    if(!ph || ph.id!=="mail") return;
    var per=String(ph.period||lastPeriod||"");
    var key=iso+"|"+course+"|"+per+"|mail";
    if(rangKey===key) return;
    rangKey=key;
    if(window.LawMailPing){
      LawMailPing.unlock && LawMailPing.unlock();
      LawMailPing.play(false);
    }
  }
  function ygm(fromClick){
    letterHold=!!fromClick;
    letterPhase=(LawKit.phase()||{}).id||"";
    viewKey="";
    if(fromClick && window.LawMailPing && LawMailPing.dismiss) LawMailPing.dismiss();
    if(fromClick) paint();
  }
  function mailTapeText(){
    var m=(kit&&kit.memo)||{};
    var lines=[];
    var body=String(m.body||"").trim();
    if(body) lines.push(body);
    if(m.task){ lines.push(""); lines.push("TASK"); lines.push(String(m.task)); }
    (m.steps||[]).forEach(function(s,i){
      if(i===0){ lines.push(""); lines.push("STEPS"); }
      lines.push(String(s));
    });
    lines.push("");
    return lines.join("\n");
  }
  function printPackets(force){
    if(course==="PLAN") return false;
    var snap=(window.LawPeriod && LawPeriod.snapshot && LawPeriod.snapshot())||{};
    var per=String(lastPeriod||snap.period||"");
    var key="lawlab.pkt3|"+iso+"|"+course+"|"+per;
    var shot="lawlab.mailshot|"+iso+"|"+course+"|"+per;
    if(!force){
      try{ if(sessionStorage.getItem(shot)==="1"){ mailPrinted=true; return true; } }catch(e){}
      window.__mailShot=shot;
      try{ sessionStorage.setItem(shot,"1"); }catch(e2){}
    }
    try{ if(!force && sessionStorage.getItem(key)==="1"){ mailPrinted=true; return true; } }catch(e){}
    if(!force && window.__pktLock===key) return false;
    if(!kit || !kit.memo){
      if(window.LawKit && LawKit.load && !window.__pktWait){
        window.__pktWait=true;
        LawKit.load(course, iso).then(function(j){ kit=j; window.__pktWait=false; printPackets(force); if(mailShown) try{ setStage(memoHtml(), pocketBox()); }catch(e){} });
      }
      window.__tapeNote="Thermal waiting on the file.";
      return false;
    }
    window.__pktLock=key;
    window.__tapeNote="Sending the whole letter to the thermal…";
    var m=(kit&&kit.memo)||{};
    var f=(kit&&kit.file)||{};
    var plan=(kit&&kit.plan)||{};
    var payload={
      kind:"packet",
      forms:"off",
      tape: force ? "force" : "auto",
      packed:true,
      name:"CLASS SET",
      iso:iso,
      course:course,
      period:per,
      from:m.fromName||m.from||"Partner",
      subject:m.subject||m.subjectLine||"",
      title:plan.title||m.subject||"",
      body:mailTapeText(),
      matter:f.matter||m.fileId||"",
      steps:[],
      facts:[],
      exhibits:[],
      docs:[]
    };
    fetch("/api/print",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(payload),keepalive:true,cache:"no-store"})
      .then(function(r){ return r.json().catch(function(){ return {}; }); })
      .then(function(j){
        var tapeOk=j && j.kind==="email" && j.ok===true && !j.error;
        if(tapeOk){
          mailPrinted=true;
          window.__tapeNote=j.skipped ? "Thermal already has this letter." : ("Thermal has the whole letter · "+(j.printer||"POS-80"));
          try{ sessionStorage.setItem(key,"1"); }catch(e){}
        } else {
          window.__tapeNote="Thermal did not take it"+(j&&j.error?(" · "+j.error):"")+". One slip per period. It will not try again on the next click.";
        }
        if(mailShown) try{ setStage(memoHtml(), pocketBox()); }catch(e){}
      })
      .catch(function(){
        window.__tapeNote="Thermal did not answer. One slip per period. It will not try again on the next click.";
      });
    return true;
  }
  function gloss(){
    if(course==="LS") return "Counsel attaches at the charge or the first court date. Appointed vs retained. Boone. Not Whitfield.";
    return "Copy the statute words. Mondawmin is a file fact, not an element of § 10-201(c)(2).";
  }
  function goPlay(id){
    var u=new URL(location.href);
    u.searchParams.set("play", id);
    u.searchParams.set("course", course);
    history.replaceState({},"",u);
    viewKey=""; paint();
  }
  function atq(){
    var a=new URLSearchParams(location.search).get("at");
    return a?("&at="+encodeURIComponent(a)):"";
  }
  function conferenceOn(){
    try{
      var map={}, parts=new Intl.DateTimeFormat("en-US",{
        timeZone:"America/New_York", year:"numeric", month:"2-digit", day:"2-digit",
        hourCycle:"h23", hour:"2-digit", minute:"2-digit", hour12:false
      }).formatToParts(new Date());
      parts.forEach(function(x){ map[x.type]=x.value; });
      if(map.hour==="24") map.hour="00";
      var h=Number(map.hour), mi=Number(map.minute);
      var dp=String(map.dayPeriod||"").toLowerCase();
      if(dp==="pm" && h<12) h+=12;
      if(dp==="am" && h===12) h=0;
      if(map.year!=="2026" || map.month!=="09" || map.day!=="24") return false;
      var mins=h*60+mi;
      return mins>=17*60+30 && mins<19*60;
    }catch(e){ return false; }
  }
  function paintConference(){
    document.body.classList.add("conf");
    document.getElementById("head").textContent="BACK TO SCHOOL";
    document.getElementById("sub").textContent="5:30–7:00";
    document.getElementById("ph").textContent="TONIGHT";
    var key="conf|2026-09-24";
    if(viewKey===key) return;

    var c=LawKit.courseNow(), d=LawKit.iso();
    var snap=(window.LawPeriod && LawPeriod.snapshot && LawPeriod.snapshot())||{};
    var p=String(snap.period||"");
    if(c==="PLAN"){
      course=c; iso=d;
      paint(); return;
    }
    if(c===course && d===iso && kit && String(kit.course||c)===c) { paint(); return; }
    var samePeriod = d===iso && p && p===String(lastPeriod);
    course=c; iso=d; kit=null; overlay=null; viewKey="";
    if(!samePeriod){ spoken=false; mailShown=false; mailPrinted=false; slide=0; manual=false; manualPhase=""; letterHold=false; rangKey=""; ringTries=0; watchOn=false; watchI=-1; if(window.LawMailPing&&LawMailPing.reset) LawMailPing.reset(); }
    loadOverlay();
    LawKit.load(course, iso).then(function(j){ kit=j; paint(); pushLead(); });
  }
  document.getElementById("main").addEventListener("click", function(e){
    var t=e.target.closest("[data-vid]");
    if(t){ openWatch(t.getAttribute("data-vid")); return; }
    var dock=e.target.closest("[data-call]");
    if(dock){
      var act=dock.getAttribute("data-call");
      if(act==="next") callAdvance();
      else if(act==="reset") callReset();
      else if(act==="lock"){ lockCall(callCard()); viewKey=""; paint(); }
      return;
    }
    var soc=e.target.closest("[data-soc]");
    if(soc){
      var how=soc.getAttribute("data-soc");
      if(how==="call") socCall();
      else window.__socI=(window.__socI||0)+1;
      viewKey="";
      paint();
      return;
    }
    if(e.target.closest("[data-openwatch]")){ openWatch(-1); return; }
    var b=e.target.closest("[data-play]"); if(!b) return;
    goPlay(b.getAttribute("data-play"));
  });
  document.getElementById("menuout").onclick=function(){ location.href="menu.html"+atq(); };
  function pushLead(){
    try{ if(window.LawLive && LawLive.setLead) LawLive.setLead(slide, course, iso); }catch(e){}
  }
  function sameCourse(a,b){
    a=String(a||""); b=String(b||"");
    if(!a||!b) return true;
    if(a===b) return true;
    return (a==="LS"||a.indexOf("LS")===0) && (b==="LS"||b.indexOf("LS")===0);
  }
  function pullLead(){ /* OneScreen is master. Teleprompter follows. */ }
  function stepSlide(d){
    var phNow=(window.LawKit&&LawKit.phase&&LawKit.phase())||{};
    if(!watchOn && (phNow.id==="quiz" || phNow.id==="entry")) return;
    mailShown=true;
    spoken=true;
    letterHold=false;
    if(watchOn){
      var list=vidList();
      if(!(watchI>=0)){ openWatch(d>0?0:list.length-1); return; }
      var n=list.length||1;
      watchI=Math.max(0, Math.min(n-1, watchI+d));
      viewKey=""; paint(); return;
    }
    manual=true;
    manualPhase=(LawKit.phase()||{}).id||"";
    var slides=deckSlides();
    var n=slides.length||1;
    if(!(slide>=0)) slide=0;
    slide=Math.max(0, Math.min(n-1, slide+d));
    viewKey="";
    paint();
    pushLead();
  }
  document.getElementById("back").onclick=function(){
    if(watchOn && watchI>=0){ openWatch(-1); return; }
    if(watchOn){ closeWatch(); return; }
    var u=new URL(location.href);
    if(u.searchParams.get("play")){
      u.searchParams.delete("play"); history.replaceState({},"",u); viewKey=""; paint(); return;
    }
    stepSlide(-1);
  };
  document.getElementById("next").onclick=function(){ stepSlide(1); };
  document.addEventListener("keydown", function(e){
    if(e.target && (e.target.tagName==="INPUT"||e.target.tagName==="TEXTAREA")) return;
    var k=e.key;
    if(k==="ArrowRight"||k==="PageDown"||k===" "||k==="n"||k==="N"||k==="Enter"){ e.preventDefault(); stepSlide(1); }
    if(k==="ArrowLeft"||k==="PageUp"||k==="b"||k==="B"){ e.preventDefault(); stepSlide(-1); }
    if(k==="w"||k==="W"){ e.preventDefault(); if(watchOn) closeWatch(); else openWatch(-1); }
    if(k==="m"||k==="M"){ e.preventDefault(); location.href="office.html?course="+course+atq(); }
    if(k==="Escape"){ e.preventDefault(); location.href="menu.html"+atq(); }
  });
  var lastRemoteAt=0;
  function runRemote(cmd){
    cmd=String(cmd||"");
    if(cmd==="next") stepSlide(1);
    else if(cmd==="back") stepSlide(-1);
    else if(cmd==="watch"){ if(watchOn) closeWatch(); else openWatch(-1); }
    else if(cmd==="mail"){ ygm(true); }
    else if(cmd==="call") location.href="clerk-call.html";
    else if(cmd==="menu") location.href="menu.html"+atq();
    else if(cmd==="prompter") location.href="prompter.html?course="+course+"&date="+iso+atq();
  }
  function pullRemote(){
    try{
      if(!window.LawLive || !LawLive.remote) return;
      var r=LawLive.remote()||{};
      if(!r.at || r.at===lastRemoteAt) return;
      lastRemoteAt=r.at;
      runRemote(r.cmd);
    }catch(e){}
  }
  document.getElementById("mail").onclick=function(){ ygm(true); };
  document.getElementById("prompter").onclick=function(){ location.href="prompter.html?course="+course+"&date="+iso+atq(); };
  document.getElementById("watch").onclick=function(){ if(watchOn) closeWatch(); else openWatch(-1); };
  var wh=document.getElementById("watchhead");
  if(wh) wh.onclick=function(){ if(watchOn) closeWatch(); else openWatch(-1); };
  function goCall(){ location.href="clerk-call.html"; }
  var ch=document.getElementById("callhead"); if(ch) ch.onclick=goCall;
  var cb=document.getElementById("callbtn"); if(cb) cb.onclick=goCall;
  fetch("data/rocket-docket.json",{cache:"no-store"}).then(function(r){ return r.ok?r.json():null; }).then(function(j){
    if(j&&j.claims){ window.__rocket=j; window.__callDeck=null; window.__callCard=null; viewKey=""; paint(); }
  }).catch(function(){});
  function liveNames(){
    var snap = (window.LawPeriod && LawPeriod.snapshot && LawPeriod.snapshot()) || {};
    var sec = snap.course || snap.section || "";
    if (sec==="LS") {
      var map = snap.map || {};
      sec = map[snap.period] || (String(snap.period)==="1" ? "LS-1" : "LS-2");
    }
    if (!sec || sec==="PLAN") sec = (course==="LS" ? "LS-1" : "ILS");
    var roster = (window.LawRoster && LawRoster.forCourse) ? (LawRoster.forCourse(sec) || []) : [];
    if (window.LawCall && LawCall.hereOnly) return LawCall.hereOnly(roster, sec);
    return [];
  }
  function getAsk(){
    var pack = overlay && overlay.courses && (overlay.courses[course] || overlay.courses.LS || overlay.courses.ILS);
    var calls = pack && pack.calls;
    if (calls && calls.length){
      var row = calls[slide % calls.length] || {};
      return row.q || row.ask || "";
    }
    if (!kit) return "";
    var slides = deckSlides();
    var s = slides[slide] || {};
    return s.ask || "";
  }
  try {
    if (window.LawCall) LawCall.mount(
      document.getElementById("callbar"),
      document.getElementById("callflash"),
      liveNames,
      function(){ return course; },
      function(){ return iso; },
      getAsk
    );
  } catch (e) {}
  try {
    var boot=new URL(location.href);
    if(boot.searchParams.get("play")==="video"){
      boot.searchParams.delete("play"); boot.searchParams.delete("v");
      history.replaceState({},"",boot);
    }
  } catch (e2) {}
  LawKit.load(course, iso).then(function(j){ kit=j; paint(); pushLead(); });
  loadOverlay();
  setInterval(reload,1000);
  if(window.LawLive && LawLive.watch) LawLive.watch(function(){ pullRemote(); }, 400);
  if("serviceWorker" in navigator) navigator.serviceWorker.register("/sw.js").catch(function(){});
})();
</script>
</body>
</html>
